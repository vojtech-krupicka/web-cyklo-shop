; Deployment to FTP hosting with dg/ftp-deployment (see "Deployment" in the README).
; Copy to config/deployment.ini (git-ignored) and fill in the remote server.
;
;   php deployment config/deployment.ini -t     preview, changes nothing
;   php deployment config/deployment.ini        deploy

[production]
; ftps:// or sftp:// if your host supports it, plain ftp:// sends the password unencrypted
remote = ftps://ftp.example.com/web
user = your-ftp-user
password = your-ftp-password

; Never deploy the working tree: build a clean export first (README), then point to it
local = /tmp/build

test = no

; Set to "no" for the very first run, until the preview shows only what you expect.
; With "yes", files that exist only on the server and are not ignored below are deleted.
allowDelete = yes

; .gitignore-style patterns, relative to "local". A leading / anchors to the project root.
ignore = "
    .git*
    /docker
    /tests
    /db
    /.devcontainer
    /.vscode
    /.env*
    /phpstan.neon
    /phpunit.xml
    /docker-compose.yml
    /AGENTS.md
    /CHANGELOG.md

    ; Live data on the server: never upload, never delete
    /config/local.*.neon
    /config/deployment.*
    /www/resources
    /www/assets/javascript/tinymce.*list.js
    /log/*
    /temp/*
"

; Compiled container and templates are rebuilt on the next request
purge[] = temp/cache

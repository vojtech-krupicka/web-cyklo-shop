date.timezone = UTC
display_errors = On
error_reporting = E_ALL

; mail() pipes the message to this program. It saves it as an .eml file
; in $FAKE_MAIL_DIR (default: var/mail) instead of sending it.
sendmail_path = "/usr/local/bin/fake_sendmail"

; Xdebug: with VS Code running inside the devcontainer, the debugger listens
; in the same container, hence 127.0.0.1. If you edit from the host instead,
; use host.docker.internal (and add extra_hosts to docker-compose.yml).
xdebug.mode = debug,develop
xdebug.start_with_request = yes
xdebug.client_host = 127.0.0.1
xdebug.client_port = 9003
; No noisy warnings when no debugger is listening
xdebug.log_level = 0
